<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Us | KIOF</title><meta name="description" content="Get in touch with Kingdom Impact Outreach Foundation.">
<meta property="og:title" content="Contact Us | KIOF"><meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/style.css"></head><body>
<a href="#main" class="sr-only focus:not-sr-only p-3">Skip to content</a><header id="site-header"></header><main id="main">

<section class="bg-[#12365A] py-20 px-5 text-center"><h1 class="text-4xl md:text-5xl" style="color:#fff">Contact Us</h1>
<p class="text-slate-200 mt-4 max-w-xl mx-auto">We'd love to hear from you.</p></section>

<section class="max-w-6xl mx-auto px-5 py-16 grid md:grid-cols-2 gap-12">
 <div><p class="p-4 rounded-lg bg-[#FFF4E9] text-sm mb-6"><b>Demo form.</b> Messages are not delivered anywhere yet.</p>
 <form id="contact-form" novalidate class="space-y-4">
  <div><label for="cname" class="text-sm">Full name</label><input id="cname" class="field" autocomplete="name"><p class="err" id="e-cname"></p></div>
  <div><label for="cemail" class="text-sm">Email</label><input id="cemail" type="email" class="field" autocomplete="email"><p class="err" id="e-cemail"></p></div>
  <div><label for="csubject" class="text-sm">Subject</label><input id="csubject" class="field"><p class="err" id="e-csubject"></p></div>
  <div><label for="cmessage" class="text-sm">Message</label><textarea id="cmessage" rows="5" class="field"></textarea><p class="err" id="e-cmessage"></p></div>
  <button class="btn btn-o">Send message</button><p id="c-status" role="status" class="text-[#12365A]"></p></form></div>
 <div class="space-y-5"><h2 class="text-2xl">Reach us</h2>
  <p class="flex gap-3"><i data-lucide="mail" class="text-[#F07824]"></i>[email placeholder]</p>
  <p class="flex gap-3"><i data-lucide="phone" class="text-[#F07824]"></i>[phone placeholder]</p>
  <p class="flex gap-3"><i data-lucide="map-pin" class="text-[#F07824]"></i>[address placeholder]</p>
  <p class="text-sm text-slate-500">Social media links: [placeholders]</p>
  <div class="ph rounded-2xl aspect-[16/10]" data-label="Map"></div></div></section>

</main><footer id="site-footer"></footer><script src="js/main.js"></script><script src="js/contact.js"></script></body></html>
